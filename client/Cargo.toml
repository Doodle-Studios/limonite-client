[package]
name = "limonite-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# No `java-listener` feature: the host binary can never bind a Java socket.
pumpkin-core = { path = "../pumpkin/crates/pumpkin-core" }
# For the Bedrock version constants.
pumpkin-world = { path = "../pumpkin/crates/pumpkin-world" }
# The `client` feature adds the codecs a client needs: writers for what it sends and readers for
# what it receives. Defaults off, so we state exactly what we use.
pumpkin-protocol = { path = "../pumpkin/crates/pumpkin-protocol", default-features = false, features = [
    "client",
] }
# The embedded server's configuration, built in code.
pumpkin-config = { path = "../pumpkin/crates/pumpkin-config" }
# P-384 types and the token parsers the server uses, to build and check the host's login.
pumpkin-auth = { path = "../pumpkin/crates/pumpkin-auth" }
# Vector types used in packet fields.
pumpkin-util = { path = "../pumpkin/crates/pumpkin-util" }
# Block and biome tables: Bedrock network ids, block names, and the map colours `--map` draws.
pumpkin-data = { path = "../pumpkin/crates/pumpkin-data" }
# Chunks carry their block actors (chests, signs, ...) as NBT.
pumpkin-nbt = { path = "../pumpkin/crates/pumpkin-nbt" }
# The vanilla resource packs, read from the user's Bedrock install.
limonite-packs = { path = "../packs" }

tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
rayon.workspace = true
rustls.workspace = true
bytes.workspace = true
base64.workspace = true
serde_json.workspace = true
image.workspace = true
