[workspace]
resolver = "3"
members = ["client", "packs"]
# The fork is its own workspace. Without this, Cargo would make every Pumpkin crate the client
# depends on by path a member of ours, and their `*.workspace = true` fields would resolve here.
exclude = ["pumpkin"]

[workspace.package]
edition = "2024"
license = "GPL-3.0"
# Matches pumpkin/Cargo.toml, so the client never needs a newer compiler than the fork.
rust-version = "1.96"

[workspace.dependencies]
# Same versions as pumpkin/Cargo.toml, so the build has one copy of each.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "env-filter",
    "fmt",
    "ansi",
] }
# The embedded server's async runtime.
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread"] }
# Pumpkin's worldgen and chunk encoding run on the global Rayon pool, which we name.
rayon = { version = "1.12", default-features = false }
# Pumpkin's HTTP client is built without a crypto provider; the process installs `ring`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
bytes = { version = "1.12", default-features = false, features = ["std"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# The packs crate's manifests and registry JSON. Same spec as pumpkin/Cargo.toml.
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
# The map's PNG writer. Exactly pumpkin-core's spec, so it adds no new package or feature.
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Profiles below mirror pumpkin/Cargo.toml. Cargo only reads profiles from the root manifest, so
# without these the fork would build with different settings here than in pumpkin/.

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1

[profile.release.package.pumpkin-data]
codegen-units = 16

[profile.release.package.pumpkin-core]
codegen-units = 16

[profile.release.package.pumpkin-world]
codegen-units = 16

[profile.release.package.pumpkin-protocol]
codegen-units = 16

# Pumpkin also sets codegen-units = 16 for pumpkin-wasm-host, -common, -v0_1 and -v0_2. Nothing
# here builds the plugin host, and Cargo warns on every build about overrides that match no
# package, so they're left out. Add them back if the client ever depends on the plugin host.

[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

# Pumpkin sets `[profile.dev] debug = false` for everything. We apply it to dependencies only, so
# our own crates keep debug info and backtraces have line numbers.
[profile.dev.package."*"]
debug = false
